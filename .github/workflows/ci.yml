name: FastAPI CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: warehouse_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse_user -d warehouse_inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://warehouse_user:ci_only_password@localhost:5432/warehouse_db
      TEST_DATABASE_URL: postgresql+psycopg://warehouse_user:ci_only_password@localhost:5432/warehouse_inventory_test
      FRONTEND_ORIGIN: http://localhost:5173
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci_only_dummy_secret_key_1234567890

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx ruff

      - name: Lint Python code
        run: ruff check . --select E4,E7,E9,F63,F7,F82

      - name: Run pytest
        run: python -m pytest -v
